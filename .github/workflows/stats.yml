name: Update profile stats cards

on:
  schedule:
    - cron: "0 3 * * *" # once a day, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    environment: main # holds the STATS_TOKEN secret
    steps:
      - uses: actions/checkout@v6

      # STATS_TOKEN (secret of the "main" environment): a PAT with repo + read:user scopes,
      # to include private contributions. Without it, GITHUB_TOKEN is used (public activity only).
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&border_radius=12&bg_color=0B1A2B&title_color=FFFFFF&text_color=C4D2E0&icon_color=19B4E8&ring_color=2BD540
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&border_radius=12&bg_color=0B1A2B&title_color=FFFFFF&text_color=C4D2E0
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile stats cards" || exit 0
          git push
